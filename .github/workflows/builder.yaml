name: Build add-ons

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: Find changed add-ons
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find add-on directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Select add-ons to build
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          apps=()
          changed_apps=()
          read -r -a apps <<< "${APPS}"

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]] \
            || [[ " ${CHANGED_FILES} " == *" .github/workflows/builder.yaml "* ]] \
            || [[ " ${CHANGED_FILES} " == *" .github/workflows/build-app.yaml "* ]]; then
            changed_apps=("${apps[@]}")
          else
            for app in "${apps[@]}"; do
              if [[ " ${CHANGED_FILES} " == *" ${app}/"* ]]; then
                changed_apps+=("${app}")
              fi
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo 'changed_apps=[]' >> "${GITHUB_OUTPUT}"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    secrets: inherit
